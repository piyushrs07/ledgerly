[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerly"
version = "1.0.0"
description = "A smart personal ledger for tracking income, expenses, and budgets"
requires-python = ">=3.10"
dependencies = ["SQLAlchemy>=2.0", "click>=8.1", "tabulate>=0.9", "numpy>=1.26", "matplotlib>=3.8"]

[project.scripts]
ledgerly = "ledgerly.cli:main"

[tool.setuptools.packages.find]
include = ["ledgerly*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
